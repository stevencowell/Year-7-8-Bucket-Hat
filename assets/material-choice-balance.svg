<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Material choice balance</title><desc id="d">A balanced material decision considers performance, making, care and responsibility.</desc><rect width="1200" height="680" rx="34" fill="#f7f3ea"/><text x="65" y="82" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#123d32">Choose materials by evidence</text><text x="65" y="124" font-family="Arial,sans-serif" font-size="22" fill="#4e5e57">No single fibre is automatically best. Judge the actual fabric against the project.</text><g font-family="Arial,sans-serif"><circle cx="600" cy="390" r="130" fill="#123d32"/><text x="600" y="375" text-anchor="middle" font-size="31" font-weight="700" fill="white">SUITABLE FOR</text><text x="600" y="416" text-anchor="middle" font-size="31" font-weight="700" fill="white">THIS HAT?</text><g text-anchor="middle" font-size="28" font-weight="700" fill="#18241f"><rect x="75" y="225" width="300" height="145" rx="25" fill="#efe6ff" stroke="#6f4aa8" stroke-width="4"/><text x="225" y="285">PERFORMANCE</text><text x="225" y="325" font-size="20" font-weight="400">comfort • strength • drape</text><rect x="825" y="225" width="300" height="145" rx="25" fill="#fff0c7" stroke="#b87a14" stroke-width="4"/><text x="975" y="285">MAKING</text><text x="975" y="325" font-size="20" font-weight="400">cutting • pressing • sewing</text><rect x="75" y="455" width="300" height="145" rx="25" fill="#e1f1e9" stroke="#39745c" stroke-width="4"/><text x="225" y="515">CARE + USE</text><text x="225" y="555" font-size="20" font-weight="400">cleaning • drying • durability</text><rect x="825" y="455" width="300" height="145" rx="25" fill="#fbe3df" stroke="#a64b3f" stroke-width="4"/><text x="975" y="515">RESPONSIBILITY</text><text x="975" y="555" font-size="20" font-weight="400">waste • longevity • claims</text></g></g><g stroke="#59756a" stroke-width="5"><line x1="375" y1="315" x2="475" y2="350"/><line x1="825" y1="315" x2="725" y2="350"/><line x1="375" y1="520" x2="475" y2="445"/><line x1="825" y1="520" x2="725" y2="445"/></g></svg>
