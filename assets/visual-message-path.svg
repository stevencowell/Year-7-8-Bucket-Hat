<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Visual message pathway</title><desc id="d">A five-step pathway from researching a cause to checking audience interpretation.</desc><rect width="1200" height="650" rx="34" fill="#f7f3ea"/><text x="65" y="82" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#123d32">Build meaning—do not just decorate</text><text x="65" y="124" font-family="Arial,sans-serif" font-size="22" fill="#4e5e57">A respectful visual message is researched, transformed and checked.</text><g font-family="Arial,sans-serif"><g stroke-width="4"><rect x="60" y="215" width="195" height="245" rx="24" fill="#efe6ff" stroke="#6f4aa8"/><rect x="280" y="215" width="195" height="245" rx="24" fill="#fff0c7" stroke="#b87a14"/><rect x="500" y="215" width="195" height="245" rx="24" fill="#e1f1e9" stroke="#39745c"/><rect x="720" y="215" width="195" height="245" rx="24" fill="#fbe3df" stroke="#a64b3f"/><rect x="940" y="215" width="195" height="245" rx="24" fill="#e7efff" stroke="#4b68a5"/></g><g text-anchor="middle" fill="#18241f"><g font-size="30" font-weight="700"><text x="158" y="272">1. RESEARCH</text><text x="378" y="272">2. DEFINE</text><text x="598" y="272">3. CREATE</text><text x="818" y="272">4. PLACE</text><text x="1038" y="272">5. CHECK</text></g><g font-size="20"><text x="158" y="320">Meaning, audience</text><text x="158" y="350">and ownership</text><text x="378" y="320">One clear idea</text><text x="378" y="350">in your own words</text><text x="598" y="320">Original palette,</text><text x="598" y="350">symbol and type</text><text x="818" y="320">Scale, contrast</text><text x="818" y="350">and hat location</text><text x="1038" y="320">Ask what a viewer</text><text x="1038" y="350">reads and why</text></g></g></g><g font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#123d32"><text x="65" y="550">Quality question:</text><text x="265" y="550" font-weight="400">Can a viewer explain the intended meaning without seeing copied campaign branding?</text></g></svg>
