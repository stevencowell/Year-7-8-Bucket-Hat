<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Decorative technique trial loop</title><desc id="d">A loop of question, sample, observe, compare and refine protects final project material.</desc><rect width="1200" height="650" rx="34" fill="#f7f3ea"/><text x="65" y="82" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#123d32">A sample is a small investigation</text><text x="65" y="124" font-family="Arial,sans-serif" font-size="22" fill="#4e5e57">Change one feature at a time so the evidence can guide the next trial.</text><g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700"><g stroke-width="4"><circle cx="215" cy="345" r="112" fill="#efe6ff" stroke="#6f4aa8"/><circle cx="475" cy="345" r="112" fill="#fff0c7" stroke="#b87a14"/><circle cx="735" cy="345" r="112" fill="#e1f1e9" stroke="#39745c"/><circle cx="995" cy="345" r="112" fill="#fbe3df" stroke="#a64b3f"/></g><g fill="#18241f" font-size="27"><text x="215" y="330">QUESTION</text><text x="215" y="365" font-size="19" font-weight="400">What must the trial show?</text><text x="475" y="330">MAKE</text><text x="475" y="365" font-size="19" font-weight="400">Use approved scrap</text><text x="735" y="330">OBSERVE</text><text x="735" y="365" font-size="19" font-weight="400">Describe visible evidence</text><text x="995" y="330">REFINE</text><text x="995" y="365" font-size="19" font-weight="400">Change one decision</text></g></g><g stroke="#59756a" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M327 345H350"/><path d="M587 345H610"/><path d="M847 345H870"/><path d="M995 458 C980 565 240 565 215 458"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#59756a"/></marker></defs></svg>
