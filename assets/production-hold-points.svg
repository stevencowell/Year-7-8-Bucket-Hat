<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">Bucket hat production hold points</title><desc id="d">Five planned hold points from pattern preparation through finishing, with proceed, correct or ask decisions.</desc><rect width="1200" height="690" rx="34" fill="#f7f3ea"/><text x="65" y="82" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#123d32">Pause before problems become permanent</text><text x="65" y="124" font-family="Arial,sans-serif" font-size="22" fill="#4e5e57">At each hold point: compare with the approved instructions, then proceed, correct or ask.</text><path d="M110 320H1090" stroke="#59756a" stroke-width="10" stroke-linecap="round"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#6f4aa8"><circle cx="150" cy="320" r="38"/><circle cx="375" cy="320" r="38"/><circle cx="600" cy="320" r="38"/><circle cx="825" cy="320" r="38"/><circle cx="1050" cy="320" r="38"/></g><g fill="white" font-size="25" font-weight="700"><text x="150" y="329">1</text><text x="375" y="329">2</text><text x="600" y="329">3</text><text x="825" y="329">4</text><text x="1050" y="329">5</text></g><g fill="#18241f" font-size="25" font-weight="700"><text x="150" y="410">PATTERN + LAYOUT</text><text x="375" y="410">CUT PIECES</text><text x="600" y="410">FIRST ASSEMBLY</text><text x="825" y="410">REVERSAL + JOIN</text><text x="1050" y="410">FINAL FINISH</text></g><g fill="#4e5e57" font-size="19"><text x="150" y="448">symbols, grain, count</text><text x="375" y="448">edges, marks, pairs</text><text x="600" y="448">alignment, curve, stitch</text><text x="825" y="448">orientation, opening, bulk</text><text x="1050" y="448">shape, comfort, evidence</text></g></g><rect x="250" y="535" width="700" height="90" rx="22" fill="#fff0c7" stroke="#b87a14" stroke-width="4"/><text x="600" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18241f">RECORD THE EVIDENCE</text><text x="600" y="608" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4e5e57">What did you check? What did you decide? What will happen next?</text></svg>
