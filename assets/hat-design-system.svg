<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Bucket hat design system</title><desc id="d">User, purpose, message, materials and construction decisions combine to create one wearable reversible bucket hat.</desc>
<rect width="1200" height="700" rx="36" fill="#f7f3ea"/><text x="70" y="86" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#123d32">A bucket hat is a design system</text><text x="70" y="128" font-family="Arial,sans-serif" font-size="22" fill="#4e5e57">Each decision affects the others. A strong result keeps the whole system working.</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#efe6ff" stroke="#6f4aa8" stroke-width="4"><rect x="70" y="210" width="260" height="130" rx="24"/><rect x="470" y="160" width="260" height="130" rx="24"/><rect x="870" y="210" width="260" height="130" rx="24"/></g><g fill="#fff0c7" stroke="#b87a14" stroke-width="4"><rect x="170" y="470" width="270" height="130" rx="24"/><rect x="760" y="470" width="270" height="130" rx="24"/></g><g font-size="28" font-weight="700" fill="#18241f"><text x="200" y="265">USER + NEED</text><text x="600" y="215">PURPOSE + MESSAGE</text><text x="1000" y="265">VISUAL CHOICES</text><text x="305" y="525">MATERIALS</text><text x="895" y="525">CONSTRUCTION</text></g><g font-size="20" fill="#36473f"><text x="200" y="300">Who will wear it?</text><text x="600" y="250">What should it do and say?</text><text x="1000" y="300">Colour, symbol, placement</text><text x="305" y="560">Properties, care, impact</text><text x="895" y="560">Accuracy, safety, finish</text></g><ellipse cx="600" cy="390" rx="155" ry="75" fill="#123d32"/><text x="600" y="382" font-size="31" font-weight="700" fill="white">WEARABLE</text><text x="600" y="418" font-size="31" font-weight="700" fill="white">REVERSIBLE HAT</text></g>
<g stroke="#59756a" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M330 275 C430 275 445 330 470 360"/><path d="M600 290V310"/><path d="M870 275 C770 275 755 330 730 360"/><path d="M440 530 C510 500 520 475 535 458"/><path d="M760 530 C690 500 680 475 665 458"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#59756a"/></marker></defs>
</svg>
