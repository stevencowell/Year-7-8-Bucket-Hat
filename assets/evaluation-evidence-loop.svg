<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Evaluation evidence loop</title><desc id="d">Criterion, method, evidence, judgement and improvement form a loop.</desc><rect width="1200" height="650" rx="34" fill="#f7f3ea"/><text x="65" y="82" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#123d32">Evaluation is an evidence loop</text><text x="65" y="124" font-family="Arial,sans-serif" font-size="22" fill="#4e5e57">A judgement is only as strong as the test and observation behind it.</text><g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700"><g stroke-width="4"><rect x="70" y="250" width="190" height="150" rx="25" fill="#efe6ff" stroke="#6f4aa8"/><rect x="290" y="250" width="190" height="150" rx="25" fill="#fff0c7" stroke="#b87a14"/><rect x="510" y="250" width="190" height="150" rx="25" fill="#e1f1e9" stroke="#39745c"/><rect x="730" y="250" width="190" height="150" rx="25" fill="#fbe3df" stroke="#a64b3f"/><rect x="950" y="250" width="190" height="150" rx="25" fill="#e7efff" stroke="#4b68a5"/></g><g fill="#18241f" font-size="26"><text x="165" y="310">CRITERION</text><text x="385" y="310">METHOD</text><text x="605" y="310">EVIDENCE</text><text x="825" y="310">JUDGEMENT</text><text x="1045" y="310">IMPROVEMENT</text></g><g fill="#4e5e57" font-size="18" font-weight="400"><text x="165" y="350">What should succeed?</text><text x="385" y="350">How will I test it?</text><text x="605" y="350">What happened?</text><text x="825" y="350">Met, partly, not met?</text><text x="1045" y="350">What exactly changes?</text></g></g><path d="M1045 430 C1030 560 180 560 165 430" stroke="#59756a" stroke-width="5" fill="none" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#59756a"/></marker></defs><text x="600" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#123d32">Use the improvement to refine the product, process or next design.</text></svg>
